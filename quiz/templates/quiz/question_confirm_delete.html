{% extends 'core/base.html' %}

{% block content %}
<div class="card" style="max-width: 500px; margin: 40px auto; text-align: center; padding: 40px;">
    <div class="creative-icon icon-delete" style="margin: 0 auto 25px; width: 70px; height: 70px;">
        <svg viewBox="0 0 24 24">
            <path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2M10 11v6M14 11v6" />
        </svg>
    </div>
    <h2 style="margin-bottom: 15px; color: var(--danger);">Delete Question</h2>
    <p style="color: var(--text-muted); margin-bottom: 30px;">Are you sure you want to delete the
        question:<br>"<strong>{{ question.text }}</strong>"?</p>

    <form method="post" style="display: flex; gap: 15px; justify-content: center;">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger"
            style="display: flex; gap: 10px; align-items: center; padding: 12px 24px;">
            <div class="creative-icon sm icon-delete"
                style="width: 20px; height: 20px; border: none; background: none; box-shadow: none;">
                <svg viewBox="0 0 24 24">
                    <path
                        d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 0 00-1 1v3M4 7h16" />
                </svg>
            </div>
            <span>Confirm Delete</span>
        </button>
        <a href="{% url 'quiz_detail' question.quiz.id %}" class="btn btn-secondary"
            style="padding: 12px 24px;">Cancel</a>
    </form>
</div>
{% endblock %}
